<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>OG image template (build-time only, never shipped)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Design tokens copied verbatim from ../assets/css/style.css so this stays
     diffable against the live site's palette — this file is a build-time
     tool only, never linked from the shipped pages. */
  :root {
    --paper: #faf8f3;
    --ink: #16233b;
    --muted: #6b6656;
    --line: #ded8c8;
    --shelf-blue: #0f4c81;
    --barcode-teal: #16897f;
    --font-display: 'Fraunces', 'Iowan Old Style', 'Georgia', serif;
    --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: var(--paper);
    font-family: var(--font-body);
    overflow: hidden;
  }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 100px;
  }
  .barcode-top, .barcode-bottom {
    position: absolute;
    left: 0;
    right: 0;
    height: 26px;
    background-image: repeating-linear-gradient(
      90deg,
      var(--barcode-teal) 0px, var(--barcode-teal) 3px, transparent 3px, transparent 7px,
      var(--barcode-teal) 7px, var(--barcode-teal) 14px, transparent 14px, transparent 20px,
      var(--barcode-teal) 20px, var(--barcode-teal) 22px, transparent 22px, transparent 27px,
      var(--barcode-teal) 27px, var(--barcode-teal) 37px, transparent 37px, transparent 41px,
      var(--barcode-teal) 41px, var(--barcode-teal) 45px, transparent 45px, transparent 47px,
      var(--barcode-teal) 47px, var(--barcode-teal) 55px, transparent 55px, transparent 58px,
      var(--barcode-teal) 58px, var(--barcode-teal) 61px, transparent 61px, transparent 65px,
      var(--barcode-teal) 65px, var(--barcode-teal) 76px, transparent 76px, transparent 81px,
      var(--barcode-teal) 81px, var(--barcode-teal) 86px, transparent 86px, transparent 91px,
      var(--barcode-teal) 91px, var(--barcode-teal) 100px, transparent 100px, transparent 108px
    );
    background-size: 108px 100%;
  }
  .barcode-top { top: 0; }
  .barcode-bottom { bottom: 0; }

  .brand {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .brand img {
    width: 84px;
    height: 84px;
    border-radius: 18px;
    flex-shrink: 0;
  }
  .brand span {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 72px;
    color: var(--shelf-blue);
    letter-spacing: -0.01em;
  }
  .tagline {
    margin: 30px 0 0;
    font-size: 32px;
    color: var(--ink);
    max-width: 900px;
    line-height: 1.35;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="barcode-top"></div>
    <div class="brand">
      <img src="../assets/img/logo.svg" alt="" width="84" height="84" />
      <span>MedInv</span>
    </div>
    <p class="tagline" id="tagline">Ihre physische Mediensammlung, selbst gehostet.</p>
    <div class="barcode-bottom"></div>
  </div>
  <script>
    // Build-time convenience only (never shipped): swap the one tagline
    // node's text based on a ?lang= query param, so the same template
    // produces both og-image-de.png and og-image-en.png without
    // duplicating the whole file. Not a runtime i18n mechanism.
    var lang = new URLSearchParams(location.search).get('lang');
    if (lang === 'en') {
      document.documentElement.lang = 'en';
      document.getElementById('tagline').textContent = 'Your physical media collection, self-hosted.';
    }
  </script>
</body>
</html>
